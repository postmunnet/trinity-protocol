version: "1.0"
# Standard ritual graph — see upstream `.ai/graphs/standard.yaml` for canonical.
states:
  - READY
  - THINK
  - SANDBOX
  - DO
  - DONE
  - ARCHIVED

transitions:
  - {from: READY, to: THINK, on: sss}
  - {from: THINK, to: THINK, on: vvv}
  - {from: THINK, to: DO, on: nnn}
  - {from: DO, to: DO, on: gogogo}
  - {from: DO, to: DONE, on: ddd}
  - {from: DONE, to: DONE, on: rrr}
  - {from: DONE, to: ARCHIVED, on: close}
