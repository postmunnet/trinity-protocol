# Trinity Protocol - Single Source of Truth (SSOT)
# This file is the canonical source for all system paths and versions.
# It is read by the ai-cli orchestrator at startup.
# Note: project_root is auto-detected at runtime; the value below is a placeholder.
version: "1.0"

paths:
  # Absolute path to the project root.
  # This is dynamically detected by the CLI at runtime.
  # The placeholder below will be overridden.
  project_root: "."

  # .ai HQ paths
  ai_root: "${project_root}/.ai"
  policies: "${ai_root}/policies"
  schemas: "${ai_root}/schemas"
  templates: "${ai_root}/templates"
  memory: "${ai_root}/memory"
  sessions: "${ai_root}/sessions"
  active_session: "${sessions}/active"
  archive_sessions: "${sessions}/archive"
  state: "${ai_root}/state"  # Global state (matches actual folder)
  audit: "${ai_root}/audit" # Global audit
  logs: "${ai_root}/logs"
  cli: "${ai_root}/cli"

deploy:
  dev:
    type: "local_copy"
    path: "${project_root}/.ai/deploy/dev"
  prod:
    type: "local_copy"
    path: "${project_root}/.ai/deploy/prod"

# Versioning for policies and schemas to ensure compatibility.
versions:
  safety_policy: "1.0"
  gates_policy: "1.0"
  rbac_policy: "1.0"
  session_state_schema: "1.0"
  events_schema: "1.0"

hooks:
  build:
    - "echo Building project (sample hook)"
  test:
    - "echo Running tests (sample hook)"
