version: 1

# Draft v1 — Safety policy for Trinity Protocol (MVP)
# This file is the SSOT for automated risk scoring and gates.

risk_scoring:
  # Factors contribute to a 0–100 risk score. Weights are indicative for MVP.
  factors:
    file_types:
      weight: 30
      rules:
        
        # Low-risk
        - match: "**/*.md"
          score: 0
        - match: "**/*.txt"
          score: 5

        # Medium-risk
        - match: "**/*.js"
          score: 50
        - match: "**/*.py"
          score: 50

        # High-risk
        - match: "db/**"
          score: 90
        - match: "migrations/**"
          score: 90

    file_count:
      weight: 25
      buckets:
        - max: 1
          score: 10
        - max: 5
          score: 40
        - max: 10
          score: 70
        - max: 9999
          score: 90

    impact_zone:
      weight: 25
      rules:
        - match: "docs/**"
          score: 0
        - match: "api/**"
          score: 50
        - match: "**/auth/**"
          score: 70
        - match: "db/**"
          score: 100

    reversibility:
      weight: 20
      rules:
        - type: "git_revertable"
          score: 10
        - type: "config_sensitive"
          score: 50
        - type: "schema_change"
          score: 90

gates:
  syntax:
    enabled: true
    description: "Language/toolchain syntax and lint checks"
  secrets:
    enabled: true
    patterns:
      - "(?i)api[_-]?key\\s*[:=]"
      - "(?i)secret\\s*[:=]"
      - "(?i)token\\s*[:=]"
    # Glob patterns (relative to scan target) skipped during secret scan.
    # These folders contain documentation / reference content, not source —
    # they reference key SHAPES and ENV-VAR NAMES in prose, not real
    # credentials. See E2E test report finding F2 (2026-04-30).
    exclude_paths:
      - "references/**"           # external repo mirrors, brain-seed retros, chatgpt_specs
      - "ai-docs/**"              # Knowledge Brain (placeholder dictionary)
      - "docs/contracts/**"       # frozen tool contract baselines (mention key names as text)
      - "docs/specs/**"           # Trinity spec pack (discusses auth env-vars by name)
      - "docs/migration/**"       # decisions / triage docs that reference secret patterns
      - ".git/**"                 # defensive
      - "node_modules/**"         # defensive
      - "dist/**"                 # defensive
      - "target/**"               # defensive (Rust)
      - "**/*.lock"               # defensive (lockfiles can have token-shaped hashes)
  tests:
    enabled: true
    min_coverage: 0
    commands:
      unit: "pytest -q"
  scope:
    mode: strict  # fail if draft.diff touches files outside 02_SCOPE allowlist

hard_blocks:
  - name: hardcoded_secrets
    regex:
      - "(?i)aws[_-]?secret[_-]?access[_-]?key"
      - "(?i)private[_-]?key"
    message: "Potential hardcoded secret detected"


# Friend Proposal Integration Rules
friend_rules:
  - rule: "Browser Automation"
    risk: "HIGH"
    check: "Manual Approval Required"

# ── LLM sibling cost guards ──────────────────────────────────────────
# Adopted 2026-06-10 by operator command (Claude Code session) from the
# SANDBOX proposal of session p2-distribution-readiness
# (PROPOSAL_cost_guard_rules.md). Closes the registry/policy disagreement:
# .ai/tools.yaml registers judge-cli + seo-genie-cli as policy-gated
# "cost guard required" but no rule bounded their spend until this block.
# decided_by: human
# Enforcement note: the policy engine reads this file; per-invocation cap
# enforcement lands in each sibling's entrypoint (they read their own
# config) — until then this block is the declared bound the siblings and
# audits are held against.
llm_sibling_guards:
  judge-cli:
    max_invocations_per_session: 3      # mirrors Pyramid layer-3 "max 3/session"
    max_panel_size: 3
    require_session: true               # refuse outside an active Trinity session
  seo-genie-cli:
    max_invocations_per_session: 10
    max_batch_items: 25
    require_session: false              # operator tool, kernel never calls it
