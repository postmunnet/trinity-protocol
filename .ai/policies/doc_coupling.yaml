# Trinity doc-coupling manifest (v1) — operator-authored, human-write-only (Article III).
#
# Declares "if code X changes, doc Y must be updated (in the same session)".
# Checked at rrr (doc-coupling gate) and via `ai doc-drift` (read-only).
#
# Detection is content-hash snapshot first (monorepo root is not a git repo),
# with `git diff` as a bonus on git-tracked instances. No manifest = gate skipped.
#
# Paths are resolved relative to the project root (the monorepo / instance root),
# NOT relative to this file's location.
#
# severity:
#   block = high-confidence doctrine/behaviour coupling — blocks RETRO->DONE
#   warn  = narrative/reference docs that may legitimately lag — allow + audit
#   info  = optional; surfaced only
version: 1

defaults:
  changelog_required: true
  timestamp_format: iso8601_with_offset   # e.g. 2026-06-15T07:42:17+07:00
  timezone: Asia/Bangkok
  # Living docs that are edited too often to carry a per-edit changelog entry —
  # they are still REQUIRED to update (missing_update), just exempt from the
  # changelog-freshness check. Versioned doctrine docs (RITUALS.md, SHORT_CODES.md)
  # are NOT exempt. Globs, project-root-relative.
  changelog_exempt:
    - "CLAUDE.md"
    - "AGENTS.md"
    - "GEMINI.md"
    - "WARP.md"
    - "dev/trinity_structure_workflow.html"

couplings:
  - id: ritual-shortcodes
    severity: block
    # Scoped to the actual ritual-shortcode command files (not all commands/*.py —
    # utility commands like doc_drift/doctor/config are NOT ritual shortcodes and
    # must not false-trigger this doctrine coupling). Found by dogfooding 2026-06-15.
    when_changed:
      - "core/trinity_v2/.ai/cli/commands/vvv.py"
      - "core/trinity_v2/.ai/cli/commands/nnn.py"
      - "core/trinity_v2/.ai/cli/commands/gogogo.py"
      - "core/trinity_v2/.ai/cli/commands/rrr.py"
      - "core/trinity_v2/.ai/cli/commands/ddd.py"
      - "core/trinity_v2/.ai/cli/commands/close.py"
      - "core/trinity_v2/.ai/cli/commands/sss.py"
      - "core/trinity_v2/.ai/cli/commands/lll.py"
      - "core/trinity_v2/.ai/cli/commands/aaa.py"
      - "core/trinity_v2/.ai/rituals/**"
    require_update:
      - "CLAUDE.md"
      - "ai-docs/SHORT_CODES.md"
      - "ai-docs/CHEATSHEET.md"
      - "core/trinity_v2/docs/RITUALS.md"
    reason: "ritual command behavior changed; doctrine surfaces must stay in lock-step"

  - id: graph-states
    severity: block
    when_changed:
      - "core/trinity_v2/.ai/graphs/standard.yaml"
      - "core/trinity_v2/.ai/cli/core/terminal_states.py"
    require_update:
      - "dev/trinity_structure_workflow.html"
      - "core/trinity_v2/docs/RITUALS.md"
    reason: "graph/terminal state behavior changed; atlas and rituals docs must reflect it"

  - id: close-ritual
    severity: block
    when_changed:
      - "core/trinity_v2/.ai/cli/commands/close.py"
      - "core/trinity_v2/.ai/cli/core/close_contract.py"
      - "core/trinity_v2/.ai/rituals/close/**"
    require_update:
      - "core/trinity_v2/docs/RITUALS.md"
      - "dev/trinity_structure_workflow.html"
    reason: "close ritual behavior changed; seal/archive doctrine must be updated"

  - id: sibling-registry
    severity: warn
    when_changed:
      - "siblings/**/package.json"
      - "siblings/REGISTRY.md"
      - "core/trinity_v2/.ai/tools.yaml"
    require_update:
      - "dev/trinity_structure_workflow.html"
      - "CLAUDE.md"
    reason: "sibling roster/status changed; atlas and operator docs may drift"

  # Recursive dogfood: the doc-drift guard keeps its OWN explainer in sync.
  # Behaviour code only (not this manifest) so adding a coupling doesn't force a
  # doc edit. warn (not block) — DOC_DRIFT_GUARD is an explainer, not a contract.
  - id: doc-drift-guard
    severity: warn
    when_changed:
      - "core/trinity_v2/.ai/cli/core/doc_coupling.py"
      - "core/trinity_v2/.ai/cli/core/fact_drift.py"
      - "core/trinity_v2/.ai/cli/commands/doc_drift.py"
    require_update:
      - "core/trinity_v2/docs/DOC_DRIFT_GUARD.md"
    reason: "doc-drift guard behaviour changed; its explainer must stay in sync"
