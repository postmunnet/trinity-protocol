name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  cli-tests:
    name: CLI tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COLUMNS: "200"
      NO_COLOR: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .ai/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .ai/requirements.txt pytest

      - name: Run CLI test suite
        run: python -m pytest .ai/cli/tests -q
